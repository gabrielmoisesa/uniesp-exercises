<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Cobrinha</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      background: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }

    .jogo {
      width: min(100%, 28rem);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      color: #f9fafb;
      font-size: 2rem;
    }

    .pontuacao {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .area-canvas {
      position: relative;
      display: inline-block;
      max-width: 100%;
      border: 0.25rem solid #374151;
      border-radius: 0.5rem;
      background: #1f2937;
      line-height: 0;
    }

    canvas {
      display: block;
      width: min(400px, calc(100vw - 3rem));
      height: auto;
      background: #111827;
    }

    .mensagem-fim {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: rgb(17 24 39 / 88%);
      line-height: normal;
    }

    .mensagem-fim.visivel {
      display: flex;
    }

    .mensagem-fim h2 {
      margin: 0;
      color: #f87171;
      font-size: 2.25rem;
    }

    .mensagem-fim p {
      margin: 0;
      font-size: 1.1rem;
    }

    button {
      padding: 0.7rem 1.2rem;
      border: 0;
      border-radius: 0.35rem;
      color: #111827;
      background: #60a5fa;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #93c5fd;
    }

    .instrucoes {
      margin: 1rem 0 0;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="jogo">
    <h1>Jogo da Cobrinha</h1>
    <p class="pontuacao">Pontuação: <span id="pontuacao">0</span></p>
    <div class="area-canvas">
      <canvas id="canvas" width="400" height="400" aria-label="Tabuleiro do jogo da cobrinha"></canvas>
      <section id="mensagem-fim" class="mensagem-fim" aria-live="polite">
        <h2>GAME OVER</h2>
        <p>Pontuação: <span id="pontuacao-final">0</span></p>
        <button id="botao-reiniciar" type="button">Jogar novamente</button>
      </section>
    </div>
    <p class="instrucoes">Use as setas do teclado para mudar de direção.</p>
  </main>

  <script>
    'use strict';

    const TAMANHO_CELULA = 20;
    const QUANTIDADE_CELULAS = 20;
    const INTERVALO_MOVIMENTO = 120;
    const canvas = document.getElementById('canvas');
    const contexto = canvas.getContext('2d');
    const mensagemFim = document.getElementById('mensagem-fim');
    const pontuacaoFinal = document.getElementById('pontuacao-final');

    let cobrinha;
    let comida;
    let direcao;
    let proximaDirecao;
    let intervaloJogo;
    let jogoEncerrado;

    // Inicia a cobrinha no centro e começa o movimento automático.
    function iniciarJogo() {
      cobrinha = [{ x: 10, y: 10 }];
      comida = gerarComida();
      direcao = { x: 1, y: 0 };
      proximaDirecao = { x: 1, y: 0 };
      jogoEncerrado = false;
      mensagemFim.classList.remove('visivel');
      desenhar();
      clearInterval(intervaloJogo);
      intervaloJogo = setInterval(atualizar, INTERVALO_MOVIMENTO);
    }

    // Move a cabeça e reaproveita a posição ao atravessar uma borda.
    function atualizar() {
      const novaCabeca = {
        x: (cobrinha[0].x + direcao.x + QUANTIDADE_CELULAS) % QUANTIDADE_CELULAS,
        y: (cobrinha[0].y + direcao.y + QUANTIDADE_CELULAS) % QUANTIDADE_CELULAS
      };

      const colidiuComCorpo = cobrinha.some(
        (parte) => parte.x === novaCabeca.x && parte.y === novaCabeca.y
      );

      if (colidiuComCorpo) {
        fimDeJogo();
        return;
      }

      direcao = proximaDirecao;
      cobrinha.unshift(novaCabeca);

      if (novaCabeca.x === comida.x && novaCabeca.y === comida.y) {
        comida = gerarComida();
      } else {
        cobrinha.pop();
      }

      desenhar();
    }

    // Para o loop e exibe o resultado quando a cobrinha colide consigo mesma.
    function fimDeJogo() {
      jogoEncerrado = true;
      clearInterval(intervaloJogo);
      pontuacaoFinal.textContent = '0';
      mensagemFim.classList.add('visivel');
    }

    // Escolhe uma célula livre para a próxima comida.
    function gerarComida() {
      const celulasLivres = [];

      for (let x = 0; x < QUANTIDADE_CELULAS; x += 1) {
        for (let y = 0; y < QUANTIDADE_CELULAS; y += 1) {
          const ocupada = cobrinha.some((parte) => parte.x === x && parte.y === y);

          if (!ocupada) {
            celulasLivres.push({ x, y });
          }
        }
      }

      return celulasLivres[Math.floor(Math.random() * celulasLivres.length)];
    }

    // Desenha o fundo, a comida vermelha e cada quadrado azul.
    function desenhar() {
      contexto.fillStyle = '#111827';
      contexto.fillRect(0, 0, canvas.width, canvas.height);

      contexto.fillStyle = '#ef4444';
      contexto.fillRect(
        comida.x * TAMANHO_CELULA,
        comida.y * TAMANHO_CELULA,
        TAMANHO_CELULA - 1,
        TAMANHO_CELULA - 1
      );

      contexto.fillStyle = '#3b82f6';

      cobrinha.forEach((parte) => {
        contexto.fillRect(
          parte.x * TAMANHO_CELULA,
          parte.y * TAMANHO_CELULA,
          TAMANHO_CELULA - 1,
          TAMANHO_CELULA - 1
        );
      });
    }

    // Impede inversão de 180 graus e evita que as setas rolem a página.
    function alterarDirecao(evento) {
      const direcoes = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
      };
      const novaDirecao = direcoes[evento.key];

      if (!novaDirecao) {
        return;
      }

      evento.preventDefault();
      const ehInversao = novaDirecao.x === -direcao.x && novaDirecao.y === -direcao.y;

      if (!ehInversao) {
        proximaDirecao = novaDirecao;
      }
    }

    document.addEventListener('keydown', alterarDirecao);
    iniciarJogo();
  </script>
</body>
</html>
