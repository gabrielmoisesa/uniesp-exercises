<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Cobrinha</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      background: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }

    .jogo {
      width: min(100%, 28rem);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      color: #f9fafb;
      font-size: 2rem;
    }

    .pontuacao {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .area-canvas {
      position: relative;
      display: inline-block;
      max-width: 100%;
      border: 0.25rem solid #374151;
      border-radius: 0.5rem;
      background: #1f2937;
      line-height: 0;
    }

    canvas {
      display: block;
      width: min(400px, calc(100vw - 3rem));
      height: auto;
      background: #111827;
    }

    .mensagem-fim {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: rgb(17 24 39 / 88%);
      line-height: normal;
    }

    .mensagem-fim.visivel {
      display: flex;
    }

    .mensagem-fim h2 {
      margin: 0;
      color: #f87171;
      font-size: 2.25rem;
    }

    .mensagem-fim p {
      margin: 0;
      font-size: 1.1rem;
    }

    button {
      padding: 0.7rem 1.2rem;
      border: 0;
      border-radius: 0.35rem;
      color: #111827;
      background: #60a5fa;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #93c5fd;
    }

    .instrucoes {
      margin: 1rem 0 0;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="jogo">
    <h1>Jogo da Cobrinha</h1>
    <p class="pontuacao">Pontuação: <span id="pontuacao">0</span></p>
    <div class="area-canvas">
      <canvas id="canvas" width="400" height="400" aria-label="Tabuleiro do jogo da cobrinha"></canvas>
      <section id="mensagem-fim" class="mensagem-fim" aria-live="polite">
        <h2>GAME OVER</h2>
        <p>Pontuação: <span id="pontuacao-final">0</span></p>
        <button id="botao-reiniciar" type="button">Jogar novamente</button>
      </section>
    </div>
    <p class="instrucoes">Use as setas do teclado para mudar de direção.</p>
  </main>

  <script>
    'use strict';
  </script>
</body>
</html>
